openapi: 3.1.0
info:
  title: DefterX API
  version: 1.0.0
  description: Offline-first finance API; monetary JSON properties are decimal strings.
servers:
  - url: /api/v1
paths:
  /auth/register: { post: { summary: Register, responses: { '201': { description: Created } } } }
  /auth/login: { post: { summary: Login, responses: { '200': { description: Tokens } } } }
  /auth/refresh: { post: { summary: Rotate refresh token, responses: { '200': { description: Tokens } } } }
  /auth/forgot-password: { post: { summary: Request password reset email without disclosing membership, responses: { '202': { description: Accepted }, '503': { description: Email unavailable } } } }
  /auth/reset-password: { post: { summary: Reset password with a single-use token, responses: { '204': { description: Reset }, '400': { description: Invalid or expired token } } } }
  /me: { get: { summary: Current user, responses: { '200': { description: User } } } }
  /me/password: { patch: { summary: Change password and rotate sessions, responses: { '200': { description: Fresh tokens }, '401': { description: Incorrect current password } } } }
  /books: { get: { summary: List books, responses: { '200': { description: Books } } }, post: { summary: Create book, responses: { '201': { description: Created } } } }
  /books/{bookId}/members: { get: { summary: List members, responses: { '200': { description: Members } } }, post: { summary: Add member, responses: { '201': { description: Added } } } }
  /accounts: { get: { summary: List accounts, responses: { '200': { description: Accounts } } }, post: { summary: Create account, responses: { '201': { description: Created } } } }
  /categories: { get: { summary: List categories, responses: { '200': { description: Categories } } }, post: { summary: Create category, responses: { '201': { description: Created } } } }
  /cost-centers: { get: { summary: List cost centers, responses: { '200': { description: Cost centers } } }, post: { summary: Create cost center, responses: { '201': { description: Created } } } }
  /cost-centers/{costCenterId}: { patch: { summary: Update cost center, responses: { '200': { description: Updated } } }, delete: { summary: Delete unused or deactivate used cost center, responses: { '200': { description: Deleted or deactivated } } } }
  /contacts: { get: { summary: List contacts, responses: { '200': { description: Contacts } } }, post: { summary: Create contact, responses: { '201': { description: Created } } } }
  /transactions: { get: { summary: List transactions with optional cost-center filter, responses: { '200': { description: Transactions } } }, post: { summary: Post transaction, responses: { '201': { description: Posted } } } }
  /transactions/{transactionId}/reverse: { post: { summary: Reverse transaction, responses: { '201': { description: Reversed } } } }
  /scheduled-transactions: { get: { summary: Upcoming, responses: { '200': { description: Items } } }, post: { summary: Create one-time or recurring items, responses: { '201': { description: Created } } } }
  /scheduled-transactions/{scheduledId}/realize: { post: { summary: Post and complete a scheduled item, responses: { '200': { description: Realized } } } }
  /recurring-transactions: { get: { summary: List, responses: { '200': { description: Items } } }, post: { summary: Create, responses: { '201': { description: Created } } } }
  /reports/dashboard: { get: { summary: Dashboard, responses: { '200': { description: Aggregates } } } }
  /reports/cash-flow: { get: { summary: Cash flow by selected granularity, responses: { '200': { description: Periods } } } }
  /reports/analytics: { get: { summary: Analytics report suite with trend, account history, category drill-down, liquidity forecast, investment performance and a holding-comparison dataset (per-instrument unit price and per-account total holding value over time), parameters: [{ in: query, name: from, schema: { type: string, format: date-time } }, { in: query, name: to, schema: { type: string, format: date-time } }, { in: query, name: accountIds, description: Comma-separated account UUIDs; omit for all or use none for no accounts, schema: { type: string } }, { in: query, name: granularity, schema: { type: string, enum: [day, week, month, year] } }], responses: { '200': { description: Analytics datasets }, '422': { description: Invalid range or account filter } } } }
  /reports/income-expense: { get: { summary: Income/expense with cost-center breakdown, parameters: [{ in: query, name: from, schema: { type: string, format: date-time } }, { in: query, name: to, schema: { type: string, format: date-time } }, { in: query, name: accountIds, description: Comma-separated account UUIDs; omit for all or use none for no accounts, schema: { type: string } }], responses: { '200': { description: Report } } } }
  /reports/balances: { get: { summary: Balances, responses: { '200': { description: Report } } } }
  /reports/receivables-payables: { get: { summary: Receivables/payables, responses: { '200': { description: Report } } } }
  /sync/push: { post: { summary: Push operations, responses: { '200': { description: Results } } } }
  /sync/pull: { get: { summary: Pull changes, responses: { '200': { description: Changes } } } }
  /investments/sales: { get: { summary: Investment sales, responses: { '200': { description: Sales } } }, post: { summary: Sell units and post proceeds, responses: { '201': { description: Sold } } } }
  /investments/market-symbols: { get: { summary: Search the weekly BIST and US market catalogue, responses: { '200': { description: Market symbols } } } }
  /investments/prices/by-date: { get: { summary: User instruments with the selected date close or zero when unavailable, responses: { '200': { description: Date prices } } } }
  /investments/prices/sync: { post: { summary: Queue a selected-day close refresh for the complete market catalogue, responses: { '202': { description: Synchronization queued } } } }
  /investments/prices/sync-status: { get: { summary: Latest complete-market price synchronization status for a date, responses: { '200': { description: Synchronization status } } } }
