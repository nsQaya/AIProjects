name: DefterX
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    APP_DISPLAY_NAME: DefterX
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  DefterXMobile:
    type: application
    platform: iOS
    sources: [DefterX]
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: DefterXMobile
        PRODUCT_BUNDLE_IDENTIFIER: com.example.defterx
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSFaceIDUsageDescription: Uygulamanızı korumak için Face ID kullanılır.
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: [com.example.defterx.sync]
        CODE_SIGN_STYLE: Automatic
  DefterXMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DefterXTests]
    dependencies:
      - target: DefterXMobile
